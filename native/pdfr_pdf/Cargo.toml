[package]
authors = []
edition = "2018"
name = "pdfr_pdf"
version = "0.1.0"

[lib]
crate-type = ["cdylib"]
name = "pdfr_pdf"
path = "src/lib.rs"

[dependencies]
# El parser por defecto de lopdf es `pom_parser` y carga a ~650 ms por MB. `nom_parser` lee
# los mismos documentos ~50x más rápido (los 19 PDFs de un contrato: 12.6 s -> 0.25 s).
lopdf = { version = "0.29.0", default-features = false, features = ["chrono_time", "nom_parser"] }
rustler = "0.30.0"
